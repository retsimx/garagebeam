name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  host:
    name: host (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (all targets, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Host tests
        run: cargo test

  arm:
    name: arm (cross release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cross release build (arm-unknown-linux-musleabihf)
        run: cross build --release --target arm-unknown-linux-musleabihf

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell tooling
        shell: bash
        run: |
          set -euo pipefail
          files="garage_beam.openrc"
          if [ -f deploy.sh ]; then files="$files deploy.sh"; fi
          if [ -f scripts/latency_report.sh ]; then files="$files scripts/latency_report.sh"; fi
          # shellcheck disable=SC2086
          shellcheck $files

  contract:
    name: contract (cross-repo byte equality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare contract.toml with the sibling repo
        shell: bash
        run: |
          set -euo pipefail
          URL=https://raw.githubusercontent.com/retsimx/garagelight/main/contract.toml
          code=$(curl -s -o /tmp/peer-contract.toml -w "%{http_code}" "$URL")
          if [ "$code" = "404" ]; then
            echo "::warning::sibling contract.toml not found (HTTP 404) - skipping byte-equality check (bootstrap)"
            exit 0
          fi
          if [ "$code" != "200" ]; then echo "::error::unexpected HTTP $code fetching $URL"; exit 1; fi
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import tomllib

          local = tomllib.loads(Path("contract.toml").read_text())
          peer = tomllib.loads(Path("/tmp/peer-contract.toml").read_text())

          local_timeout = local.pop("keepalive_timeout_ms", None)
          peer_timeout = peer.pop("keepalive_timeout_ms", None)

          if local_timeout != 3000:
              print("::error::local keepalive_timeout_ms must be 3000")
              sys.exit(1)
          if peer_timeout is not None and peer_timeout != local_timeout:
              print("::error::keepalive_timeout_ms differs from sibling")
              sys.exit(1)
          if local != peer:
              print("::error::contract.toml differs from sibling outside the coordinated keepalive_timeout_ms field")
              print("local-only keys:", sorted(set(local) - set(peer)))
              print("peer-only keys:", sorted(set(peer) - set(local)))
              sys.exit(1)
          print("contract fields match; keepalive timeout=3000")
          PY
